# ---------------------------------
# Socks5-Over-AES Proxy Configuration
# ---------------------------------

# client:
client.auth.token=token

# client services switch
client.socks5.enabled=true
client.http.enabled=true
client.https.enabled=true

# client listen ports
client.socks5.port=9090
client.socks5.password.auth.enabled=false
client.socks5.username=admin
client.socks5.password=123456
client.http.port=9091
client.https.port=9092
# direct access allow-list config file (hot reload supported)
client.direct.allow.path=./direct-allow.conf
# target block-list config file (hot reload supported)
client.block.path=./block.conf

# remote server target
server.host=127.0.0.1

# server:
server.auth.token.list=token-01,token-02
server.key.path=server.key

# common:
server.port=8001
server.cert.path=server.crt

# Optional fixed TCP mappings on A. Uncomment and replace the example destinations.
# Use "client -config proxy.properties forward" to run only these listeners.
# client.forward.11001=tw-node.example:1080
# client.forward.11002=jp-node.example:1080
# Optional SOCKS5 TCP + UDP on the corresponding fixed mapping (updated Go A and B).
# client.forward-udp.11001=true
# Allow this UDP range from PCs to A, one port per association.
# client.udp.ports=20000-20127
# Behind NAT, advertise A's reachable IP and forward the same UDP ports.
# client.udp.advertise-ip=203.0.113.10

# Optional: centrally manage fixed mappings on A (client or forward mode).
# Create the node in the center UI first. Never reuse the tunnel token here.
# center.url=https://control.example.com:8443
# center.node-id=gz-a01
# center.node-token=copy-the-one-time-displayed-key
# center.cache=/var/lib/socks5-go/gz-a01-applied.json

# monitor:
server.monitor.host=127.0.0.1
server.monitor.port=18080
