<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · STest</title>
<style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:#f2f6fb;color:#182838;font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}main{background:white;border:1px solid #dce4ef;border-radius:18px;padding:clamp(20px,5vw,36px);width:min(100%,410px);box-shadow:0 12px 42px #16345310}.brand{color:#0069d5;font-weight:750}h1{margin:12px 0 0;font-size:25px}p{color:#536475}label{display:block;margin:12px 0}input,button{font:inherit;width:100%;border-radius:9px;padding:10px}input{border:1px solid #b9c8d9}button{background:#0069d5;color:white;border:0;cursor:pointer}#err{color:#a53730;min-height:1em}button:disabled{opacity:.6}</style>
<main><div class="brand">STest / 管理中心</div><h1 id="title">管理员登录</h1><p id="hint">使用管理员账号访问转发服务控制台。</p>
<form id="f"><label><span id="label">账号</span><input id="user" autocomplete="username" maxlength="64" required></label><label><span id="pwlabel">密码</span><input id="pw" autocomplete="current-password" type="password" required></label><label id="repeat" hidden>确认新密码<input id="confirmPw" type="password" autocomplete="new-password"></label><p id="err" role="alert"></p><button id="submitBtn">登录</button></form></main>
<script>
const $=id=>document.getElementById(id);let change=false;
function mode(v){change=v;$('f').reset();$('title').textContent=v?'设置管理员凭据':'管理员登录';$('hint').textContent=v?'首次登录须同时更换账号和密码，保存后请重新登录。':'使用管理员账号访问转发服务控制台。';$('label').textContent=v?'新账号（不能是 admin）':'账号';$('pwlabel').textContent=v?'新密码（至少 12 个字符）':'密码';$('pw').autocomplete=v?'new-password':'current-password';$('repeat').hidden=!v;$('confirmPw').required=v;$('submitBtn').textContent=v?'保存并返回登录':'登录';$('err').textContent='';$('user').focus()}
async function init(){const r=await fetch('/auth/status');if(!r.ok)throw Error('无法读取登录状态');mode((await r.json()).change)}
$('f').onsubmit=async e=>{e.preventDefault();$('submitBtn').disabled=true;$('err').textContent='';try{if(change&&$('pw').value!==$('confirmPw').value)throw Error('两次密码不一致');
const r=await fetch(change?'/auth/change':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Center-Request':'1'},body:JSON.stringify({username:$('user').value,password:$('pw').value})});if(!r.ok){const msg=await r.text();if(change&&r.status===401)mode(false);throw Error(msg)}const result=await r.json();if(change){mode(false);$('hint').textContent='新凭据已保存，请用新账号和新密码登录。'}else if(result.change){mode(true)}else{location.replace('/')}}catch(e){$('err').textContent=e.message}finally{$('submitBtn').disabled=false}};
$('submitBtn').disabled=true;init().catch(e=>$('err').textContent=e.message).finally(()=>$('submitBtn').disabled=false)
</script></html>
